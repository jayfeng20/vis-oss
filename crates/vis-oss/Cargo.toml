[package]
name = "vis-oss"
description = "Scaffold, validate and render agent-generated studies of open-source issues"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = { version = "4", features = ["supports-colors"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
textwrap = "0.16"

[lints]
workspace = true
