# One Cargo project per repository studied, shared by every issue directory under it.
# Per-issue projects would each get their own target/, so lance's ~900-crate dependency
# graph would be compiled again for every study.
#
# Point the `lance` path at your own checkout before running anything.

[package]
name = "lance-studies"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
lance = { path = "/Users/you/Coding/lance/rust/lance" }
# arrow is not listed: lance re-exports it as lance::deps::arrow_array precisely so a
# caller cannot drift off lance's own version (rust/lance/src/lib.rs:119).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "804_flat_search"
path = "804/01_flat_search.rs"
